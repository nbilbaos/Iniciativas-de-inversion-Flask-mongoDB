services:
  - type: web
    name: flask-mongodb-app
    env: python
    plan: starter # Cambia a free si estás usando el plan gratuito
    buildCommand: |
      pip install -r requirements.txt
      chmod +x setup.sh
      ./setup.sh
    startCommand: gunicorn run:application
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: INITIATIVES_COLLECTION
        value: db_metadata.iniciativas_2025
    healthCheckPath: /health
{% extends "base.html" %}

{% block title %}404 - Página no encontrada{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <h1 class="display-1">404</h1>
    <p class="lead">Lo sentimos, la página que estás buscando no existe.</p>
    <p>Puede que hayas ingresado mal la dirección o que la página se haya movido.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary mt-3">Volver al inicio</a>
</div>
{% endblock %}
